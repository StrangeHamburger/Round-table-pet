<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌面宠物</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:transparent; }
  canvas{ display:block; }

  /* ---- 设置菜单 ---- */
  #menu{
    position:fixed; z-index:10; width:224px;
    background:rgba(24,28,35,0.97);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:16px;
    padding:14px 16px 16px;
    color:#e8ecf2;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    box-shadow:0 12px 40px rgba(0,0,0,0.45);
    user-select:none;
    opacity:0; transform:translateY(6px) scale(0.96);
    pointer-events:none; transition:.18s ease;
  }
  #menu.open{ opacity:1; transform:none; pointer-events:auto; }
  #menu .m-title{ font-size:11px; letter-spacing:1px; color:#9aa7b5; margin-bottom:8px; }
  #menu .m-row{ display:flex; gap:8px; margin-bottom:12px; }
  #menu button{
    flex:1; appearance:none; border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.06); color:#e8ecf2;
    padding:8px 0; border-radius:10px; font-size:13px; cursor:pointer; transition:.15s;
  }
  #menu button:hover{ background:rgba(255,255,255,0.14); border-color:rgba(255,255,255,0.25); }
  #menu button.danger:hover{ background:rgba(255,90,90,0.20); border-color:rgba(255,110,110,0.4); }
  #menu .m-slider{ width:100%; margin:2px 0 12px; accent-color:#8fd0b0; }
  #menu .m-size-val{ font-size:12px; color:#9aa7b5; text-align:right; margin-top:-6px; margin-bottom:12px; }
  #menu .m-sw{ display:flex; gap:8px; margin-bottom:12px; }
  #menu .m-sw .sw{
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; transition:.15s; padding:0; flex:none;
  }
  #menu .m-sw .sw:hover{ transform:scale(1.12); }
  #menu .m-sw .sw.active{ border-color:#fff; }
  #menu .m-act{ display:flex; gap:8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="m-title">团团 · 设置</div>
  <div class="m-row">
    <button id="mHome">定家</button>
    <button id="mGoHome">回家</button>
  </div>
  <div class="m-title">大小</div>
  <input type="range" id="mSize" class="m-slider" min="21" max="60" value="35">
  <div class="m-size-val" id="mSizeVal">35</div>
  <div class="m-title">配色</div>
  <div class="m-sw" id="mSwatches"></div>
  <div class="m-act">
    <button id="mQuit" class="danger">退出</button>
  </div>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const menu = document.getElementById('menu');

let W = 0, H = 0, DPR = 1, R = 35, floorY = 0;
let ox = 0, oy = 0;

const RAND = (a,b) => a + Math.random() * (b - a);
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp  = (a,b,t) => a + (b - a) * t;

function resize(){
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  applySize();
  if (!pet.x){ pet.x = W / 2; pet.y = floorY; }
  if (!pet.homeSet){ pet.homeX = W / 2; pet.homeSet = true; }
}
window.addEventListener('resize', resize);

function applySize(){
  const m = document.getElementById('mSize');
  R = clamp(parseInt(m.value) || 35, 21, 60);
  floorY = H - R - 8;
  if (pet.y > floorY) pet.y = floorY;
}

// ---------- 配色 ----------
const PALETTES = [
  { body:'#F6E7C6', eye:'#6B4E33' },
  { body:'#F4EFE6', eye:'#2E2B28' },
  { body:'#F2D8D5', eye:'#7A3A48' },
  { body:'#D9E8DC', eye:'#2F5D4A' },
  { body:'#DCE4EC', eye:'#2C3E5C' },
];
let bodyColor = PALETTES[0].body;
let eyeColor  = PALETTES[0].eye;

function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0){ const k = 1 + amt; r *= k; g *= k; b *= k; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  const h = x => Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0');
  return '#' + h(r) + h(g) + h(b);
}

// ---------- 宠物状态 ----------
const pet = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  walkDir: 1,
  mood: 'neutral', moodUntil: 0, nextAutoMood: 0,
  behavior: '', behaviorUntil: 0, behaviorStart: 0, behaviorDur: 1200,
  nextBehavior: 3000,
  homeX: 0, homeSet: false, goingHome: false,
  look: { x: 0, y: 0 },
  openL: 1, openR: 1,
  blinkStart: 0, blinkDur: 0, nextBlink: 0,
  saccadeUntil: 0, saccade: { x: 0, y: 0 },
  chasing: false, chaseUntil: 0,
  shake: 0,          // 抖动强度
  hopIdx: -1,        // 抽风蹦跳计数
  turnAt: 0,         // 满屏疯跑时的下次转向时刻
};
let now = 0, lastNow = 0;
resize();

// ---------- 鼠标 / 交互 ----------
const mouse = { x: 0, y: 0, active: false, px: 0, py: 0, vx: 0, vy: 0 };
let dragging = false, dragDX = 0, dragDY = 0, dragMoved = false;
let downTime = 0, downX = 0, downY = 0, hovering = false;
let downRelX = 0, downRelY = 0;
let ignoring = true, menuOpen = false;
let petStreak = 0, petStreakT = 0, lastPetted = 0, pressHold = 0;
let lastInteract = 0, lastStartle = 0;
let excite = 0;                 // 兴奋度 0..1（互动越多越兴奋，动作越频繁）
let lastHeadTap = 0, headTapCount = 0;
let orbitHist = [];             // 鼠标绕圈检测
let music = { playing: false };
// 舞步状态：随音乐随机切换不同舞步，让舞蹈更多样
let dance = { style: 0, next: 0, hopT: 0 };
// 音乐时的表情轮换（慢速切换，避免眼睛变太快）
let musicMood = { m: 'happy', next: 0 };

function setIgnore(v){
  if (v === ignoring) return;
  ignoring = v;
  desktopAPI.setIgnore(v);
}

desktopAPI.getInfo().then(info => { ox = info.x; oy = info.y; });

// 音乐播放状态（GSMTC）：有音乐播放就跳舞
desktopAPI.onMusic(s => {
  if (!s) return;
  music.playing = !!s.playing;
});

function mouseOver(lx, ly){
  const d2 = (lx - pet.x) * (lx - pet.x) + (ly - pet.y) * (ly - pet.y);
  return d2 <= R * R;
}

// 全局光标
desktopAPI.onCursor(p => {
  const lx = p.x - ox, ly = p.y - oy;
  if (!dragging){
    mouse.px = mouse.x; mouse.py = mouse.y;
    mouse.vx = lx - mouse.px; mouse.vy = ly - mouse.py;
    mouse.x = lx; mouse.y = ly; mouse.active = true;
  }
  if (!menuOpen && !dragging){
    const over = mouseOver(lx, ly);
    setIgnore(!over);
    hovering = over;
    cv.style.cursor = over ? 'grab' : 'default';
  }
  // 快速扫过它 → 受惊（眼睛瞪大、往后躲一下）
  const speed = Math.hypot(mouse.vx, mouse.vy);
  if (!menuOpen && !dragging && speed > 35 && mouseOver(lx, ly) && performance.now() - lastStartle > 1200){
    lastStartle = performance.now();
    pet.mood = 'surprised'; pet.moodUntil = performance.now() + 500;
    pet.vy = -5;
    pet.vx = (lx < pet.x ? 1 : -1) * 2.5;
    setBehavior('被吓一跳', 700);
  }

  // 绕圈逗它 → 被转晕
  if (!menuOpen && !dragging){
    const d = Math.hypot(lx - pet.x, ly - pet.y);
    if (d < R * 2.6){
      orbitHist.push({ a: Math.atan2(ly - pet.y, lx - pet.x), t: performance.now() });
      if (orbitHist.length > 60) orbitHist.shift();
      const t0 = performance.now() - 1500;
      let total = 0;
      for (let i = 1; i < orbitHist.length; i++){
        if (orbitHist[i].t < t0) continue;
        let da = orbitHist[i].a - orbitHist[i - 1].a;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        total += da;
      }
      if (Math.abs(total) > Math.PI * 2.2){
        orbitHist = [];
        lastInteract = performance.now();
        excite = clamp(excite + 0.3, 0, 1);
        pet.mood = 'dizzy'; pet.moodUntil = performance.now() + 1800;
        pet.shake = 1;
        setBehavior('被转晕', 1800);
      }
    } else {
      orbitHist = [];
    }
  }
});

window.addEventListener('mousemove', e => {
  const lx = e.clientX, ly = e.clientY;
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.vx = lx - mouse.px; mouse.vy = ly - mouse.py;
  mouse.x = lx; mouse.y = ly; mouse.active = true;
  if (dragging){
    const nx = lx - dragDX, ny = ly - dragDY;
    if (Math.hypot(nx - pet.x, ny - pet.y) > 6) dragMoved = true;
    pet.x = nx; pet.y = ny;
    pet.vx = mouse.vx; pet.vy = mouse.vy;
  }
});

window.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (menuOpen){
    if (!menu.contains(e.target)) closeMenu();
    return;
  }
  const dx = e.clientX - pet.x, dy = e.clientY - pet.y;
  downTime = performance.now();
  pressHold = downTime;
  downRelX = dx; downRelY = dy;
  if (dx * dx + dy * dy <= R * R){
    dragging = true; dragDX = dx; dragDY = dy; dragMoved = false;
    lastInteract = performance.now();
    cv.style.cursor = 'grabbing';
  }
});

window.addEventListener('mouseup', e => {
  if (menuOpen) return;
  const held = performance.now() - downTime;

  if (dragging){
    dragging = false;
    cv.style.cursor = 'grab';
    if (dragMoved){
      // 真拖拽：速度够快就甩飞
      if (Math.hypot(mouse.vx, mouse.vy) > 12){
        pet.vx = mouse.vx * 1.1; pet.vy = mouse.vy * 1.1 - 3;
        pet.mood = 'surprised'; pet.moodUntil = performance.now() + 700;
        setBehavior('甩飞');
        lastInteract = performance.now();
      }
      setIgnore(!mouseOver(mouse.x, mouse.y));
      return;
    }
    // 没有拖动（原地按下又松开）→ 当作点击 / 长按，继续往下判断
    setIgnore(!mouseOver(mouse.x, mouse.y));
  }

  const dx = e.clientX - pet.x, dy = e.clientY - pet.y;
  if (dx * dx + dy * dy <= R * R * 1.2){
    if (held < 260){
      if (downRelY < -R * 0.18) headTap(dx, dy);
      else clickPet();
    } else if (held >= 600){
      if (downRelY > R * 0.1) bellyRub();
      else tickle();
    }
  }
});

function headTap(dx, dy){
  const t = performance.now();
  if (t - lastHeadTap < 500) headTapCount++; else headTapCount = 1;
  lastHeadTap = t;
  lastInteract = t;
  if (headTapCount >= 2){
    headTapCount = 0;
    excite = clamp(excite + 0.4, 0, 1);
    pet.mood = 'happy'; pet.moodUntil = t + 1100;
    pet.vy = -7;
    setBehavior('被拍头', 1300);
  } else {
    excite = clamp(excite + 0.25, 0, 1);
    pet.mood = 'dizzy'; pet.moodUntil = t + 900;
    pet.vx = (dx < 0 ? 1 : -1) * 3;
    pet.vy = -4;
    setBehavior('被弹脑门', 900);
  }
}

function bellyRub(){
  lastInteract = performance.now();
  excite = clamp(excite + 0.35, 0, 1);
  pet.shake = 1.4;
  pet.mood = 'happy'; pet.moodUntil = performance.now() + 1200;
  setBehavior('被挠肚皮', 1400);
}

function tickle(){
  lastInteract = performance.now();
  excite = clamp(excite + 0.2, 0, 1);
  pet.shake = 1; pet.mood = 'happy'; pet.moodUntil = performance.now() + 1000;
  setBehavior('被挠痒痒');
}

window.addEventListener('dblclick', e => {
  if (menuOpen) return;
  const dx = e.clientX - pet.x, dy = e.clientY - pet.y;
  if (dx * dx + dy * dy <= R * R){
    // 双击 → 追逐鼠标
    lastInteract = performance.now();
    pet.chasing = true;
    pet.chaseUntil = performance.now() + 6000;
    pet.mood = 'surprised'; pet.moodUntil = performance.now() + 600;
    setBehavior('追着你跑');
  }
});

window.addEventListener('contextmenu', e => {
  e.preventDefault();
  openMenu();
});

function clickPet(){
  lastInteract = performance.now();
  excite = clamp(excite + 0.35, 0, 1);
  pet.vy = -6;
  pet.mood = 'surprised'; pet.moodUntil = performance.now() + 600;
  setBehavior('被点了一下');
  const t = performance.now();
  if (t - petStreakT < 800) petStreak++; else petStreak = 1;
  petStreakT = t;
  if (petStreak >= 3){
    pet.chasing = false;           // 连点3下会顺带触发 dblclick 的追逐，这里取消掉
    pet.mood = 'dizzy'; pet.moodUntil = t + 1500;
    setBehavior('被戳晕了');
    petStreak = 0;
  }
}

// ---------- 菜单 ----------
function buildSwatches(){
  const box = document.getElementById('mSwatches');
  box.innerHTML = '';
  PALETTES.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'sw' + (i === 0 ? ' active' : '');
    b.style.background = p.body;
    b.addEventListener('click', () => {
      bodyColor = p.body; eyeColor = p.eye;
      box.querySelectorAll('.sw').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
    box.appendChild(b);
  });
}
buildSwatches();

document.getElementById('mHome').addEventListener('click', () => {
  pet.homeX = pet.x; pet.homeSet = true;
  pet.vy = -4; pet.mood = 'happy'; pet.moodUntil = performance.now() + 900;
  setBehavior('记下家了');
  closeMenu();
});
document.getElementById('mGoHome').addEventListener('click', () => {
  if (pet.homeSet){ pet.goingHome = true; pet.mood = 'neutral'; pet.moodUntil = 0; }
  closeMenu();
});
document.getElementById('mQuit').addEventListener('click', () => {
  desktopAPI.quit();
});
document.getElementById('mSize').addEventListener('input', () => {
  document.getElementById('mSizeVal').textContent = document.getElementById('mSize').value;
  applySize();
});

function openMenu(){
  menuOpen = true;
  setIgnore(false);
  // 定位在宠物上方
  const mw = 224, mh = menu.offsetHeight || 300;
  let mx = pet.x - mw / 2;
  let my = pet.y - R - mh - 24;
  mx = clamp(mx, 12, W - mw - 12);
  if (my < 12) my = pet.y + R + 24;
  menu.style.left = mx + 'px';
  menu.style.top = my + 'px';
  menu.classList.add('open');
}
function closeMenu(){
  if (!menuOpen) return;
  menuOpen = false;
  menu.classList.remove('open');
  setIgnore(!mouseOver(mouse.x, mouse.y));
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

function setBehavior(t, dur = 1200){
  pet.behavior = t;
  pet.behaviorStart = performance.now();
  pet.behaviorDur = dur;
  pet.behaviorUntil = pet.behaviorStart + dur;
  // 任何行为（含互动触发）结束后，都要等一段空档再进下一个待机动作，
  // 避免刚触发的互动被随机的待机行为立即覆盖。
  pet.nextBehavior = pet.behaviorUntil + RAND(2000, 5000) * (1 - excite * 0.5);
}

function startBlink(t){
  pet.blinkStart = t;
  pet.blinkDur = 160;
  pet.nextBlink = t + pet.blinkDur + RAND(2000, 4500);
}

const AUTO_MOODS = ['neutral','happy','sad','surprised','sleepy','dizzy','dazed','pleading'];
function randomMood(){ return AUTO_MOODS[(Math.random() * AUTO_MOODS.length) | 0]; }

// ---------- 更新 ----------
// 待机行为表：name / 时长 / 权重（权重越大越常出现）
// 特殊创意行为权重刻意压低，作为"偶尔"的惊喜
const BEHAVIORS = [
  ['扫视四周', 800, 2.0],
  ['发呆', 2400, 2.0],
  ['打了个哈欠', 1400, 2.0],
  ['伸了个懒腰', 1200, 2.0],
  ['叹了口气', 1300, 2.0],
  ['蹦了一下', 700, 2.2],
  ['打了个喷嚏', 1400, 2.0],
  ['打滚', 1600, 2.0],
  ['躲猫猫', 1800, 2.0],
  ['打瞌睡', 2600, 2.2],
  ['哼歌摇摆', 2400, 2.0],
  ['卖萌', 1100, 2.0],
  ['数蚂蚁', 2200, 2.0],
  ['睡死打呼噜', 3200, 2.0],
  ['偷看你', 1800, 2.0],
  ['突然抽风', 900, 1.6],
  ['神经质扫视', 1600, 1.6],
  ['自己吓自己', 1200, 1.6],
  ['斜眼挑衅', 1800, 1.6],
  ['冒泡泡', 2600, 2.0],
  // 新增待机
  ['打嗝', 2000, 1.6],
  ['望天发呆', 2400, 2.0],
  ['思考', 2800, 2.0],
  ['抖腿', 1800, 1.6],
  ['抓痒', 1600, 1.6],
  ['打坐冥想', 3200, 1.6],
  ['连环喷嚏', 2200, 1.6],
  ['追尾巴', 2000, 2.0],
  // 创意特殊行为（低权重）
  ['满屏疯跑', 6500, 0.9],
  ['爬到上面', 5200, 0.9],
  ['咬鼠标', 4200, 0.9],
  ['穿屏瞬移', 5200, 0.8],
];
let BEHAVIOR_TOTAL = 0;
BEHAVIORS.forEach(b => BEHAVIOR_TOTAL += b[2]);

function updateBehavior(){
  if (music.playing) return; // 音乐播放时不随机待机，专心跳舞
  if (now < pet.nextBehavior) return;

  // 按权重随机选一个行为
  let pick = Math.random() * BEHAVIOR_TOTAL, chosen = null;
  for (const b of BEHAVIORS){
    pick -= b[2];
    if (pick <= 0){ chosen = b; break; }
  }
  if (!chosen) chosen = BEHAVIORS[BEHAVIORS.length - 1];
  const [name, dur] = chosen;
  setBehavior(name, dur);

  // 各行为的启动效果（初速度/方向等）
  if (name === '蹦了一下'){ pet.vy = -6; }
  else if (name === '伸了个懒腰'){ pet.vy = -4; }
  else if (name === '突然抽风'){ pet.vx = (Math.random() < 0.5 ? -1 : 1) * 2; }
  else if (name === '自己吓自己'){ pet.vx = (Math.random() < 0.5 ? -1 : 1) * 5; pet.vy = -6; }
  else if (name === '满屏疯跑'){
    pet.vx = (Math.random() < 0.5 ? -1 : 1) * RAND(5, 9);
    pet.vy = -RAND(3, 7);
    pet.turnAt = now + RAND(800, 1600);
  }
  else if (name === '爬到上面'){
    pet.vy = -9;
    pet.vx = (Math.random() < 0.5 ? -1 : 1) * 2;
  }
  else if (name === '咬鼠标'){
    pet.vx = 0; pet.vy = 0;
  }
  else if (name === '穿屏瞬移'){
    pet.vx = 0; pet.vy = 3;
  }
}

function updateMood(){
  // 音乐播放且不在互动动作里 → 表情慢速轮换（避免眼睛变太快）
  if (music.playing && now >= pet.behaviorUntil){
    if (now >= musicMood.next){
      musicMood.next = now + RAND(2500, 5000);
      const arr = ['happy', 'surprised', 'sleep', 'wink', 'dazed', 'pleading'];
      musicMood.m = arr[(Math.random() * arr.length) | 0];
    }
    pet.mood = musicMood.m;
    return;
  }
  if (now >= pet.moodUntil && now >= pet.nextAutoMood){
    pet.nextAutoMood = now + RAND(6000, 12000) * (1 - excite * 0.4);
    pet.mood = randomMood();
    pet.moodUntil = now + RAND(1500, 3000);
  }
  if (now < pet.behaviorUntil){
    if (pet.behavior === '打了个哈欠') pet.mood = 'sleepy';
    else if (pet.behavior === '伸了个懒腰') pet.mood = 'sleepy';
    else if (pet.behavior === '叹了口气') pet.mood = 'sad';
    else if (pet.behavior === '打了个喷嚏') pet.mood = 'surprised';
    else if (pet.behavior === '打滚') pet.mood = 'neutral';
    else if (pet.behavior === '发呆') pet.mood = 'sleepy';
    else if (pet.behavior === '打瞌睡') pet.mood = 'sleepy';
    else if (pet.behavior === '睡死打呼噜') pet.mood = 'sleep';
    else if (pet.behavior === '哼歌摇摆') pet.mood = 'happy';
    else if (pet.behavior === '卖萌') pet.mood = 'surprised';
    else if (pet.behavior === '数蚂蚁') pet.mood = 'neutral';
    else if (pet.behavior === '偷看你') pet.mood = 'neutral';
    else if (pet.behavior === '突然抽风') pet.mood = 'surprised';
    else if (pet.behavior === '神经质扫视') pet.mood = 'neutral';
    else if (pet.behavior === '自己吓自己') pet.mood = 'surprised';
    else if (pet.behavior === '斜眼挑衅') pet.mood = 'sneer';
    else if (pet.behavior === '冒泡泡') pet.mood = 'happy';
    // 新增待机的表情
    else if (pet.behavior === '打嗝') pet.mood = 'dazed';
    else if (pet.behavior === '望天发呆') pet.mood = 'dazed';
    else if (pet.behavior === '思考') pet.mood = 'neutral';
    else if (pet.behavior === '抖腿') pet.mood = 'neutral';
    else if (pet.behavior === '抓痒') pet.mood = 'happy';
    else if (pet.behavior === '打坐冥想') pet.mood = 'sleep';
    else if (pet.behavior === '连环喷嚏') pet.mood = 'surprised';
    else if (pet.behavior === '追尾巴') pet.mood = 'dizzy';
    // 特殊行为的表情
    else if (pet.behavior === '满屏疯跑') pet.mood = 'surprised';
    else if (pet.behavior === '爬到上面') pet.mood = 'surprised';
    else if (pet.behavior === '咬鼠标') pet.mood = 'fierce';
    else if (pet.behavior === '穿屏瞬移') pet.mood = 'surprised';
  }
}

// 舞步：随音乐每 2~4 秒随机切换一种舞姿（只整体平移，不变形）
function updateDance(){
  if (!music.playing){ dance.style = 0; return; }
  if (now >= dance.next){
    dance.next = now + RAND(2000, 4000);
    dance.style = (Math.random() * 6) | 0;
  }
}

// 返回当前舞步的整体位移 {x, y}，供 draw() 平移身体
function danceOffset(){
  const t = now;
  switch (dance.style){
    case 0: // 蹦迪：上下蹦 + 左右小摆
      return { x: Math.sin(t * 0.005) * R * 0.10,
               y: -Math.abs(Math.sin(t * 0.008)) * R * 0.16 };
    case 1: // 摇摆：像钟摆一样左右大晃
      return { x: Math.sin(t * 0.006) * R * 0.22,
               y: -Math.abs(Math.sin(t * 0.012)) * R * 0.03 };
    case 2: // 点头打拍：上下点头
      return { x: 0,
               y: -Math.abs(Math.sin(t * 0.012)) * R * 0.12 };
    case 3: // 画圈：身体绕中心画小圆圈
      return { x: Math.cos(t * 0.008) * R * 0.14,
               y: Math.sin(t * 0.008) * R * 0.10 - R * 0.05 };
    case 4: // 扭动：左右快速小幅度扭
      return { x: Math.sin(t * 0.02) * R * 0.07,
               y: -Math.abs(Math.sin(t * 0.016)) * R * 0.06 };
    default: // 大跳：突然蹦起来（偶尔离地）
      const beat = Math.floor(t / 500) % 4;
      const ph = (t % 500) / 500;
      return { x: Math.sin(t * 0.004) * R * 0.06,
               y: beat === 0 ? -Math.sin(ph * Math.PI) * R * 0.30 : -Math.abs(Math.sin(t * 0.008)) * R * 0.05 };
  }
}

function updateLook(){
  if (now >= pet.saccadeUntil){
    pet.saccadeUntil = now + RAND(2500, 5000);
    const a = RAND(0, Math.PI * 2);
    pet.saccade = { x: Math.cos(a) * R * 0.5, y: Math.sin(a) * R * 0.5 };
  }
  let tx, ty;
  // 数蚂蚁：眼睛盯着地面上慢悠悠爬的"蚂蚁"
  if (pet.behavior === '数蚂蚁' && now < pet.behaviorUntil){
    tx = Math.sin(now * 0.0022) * R * 0.55;
    ty = Math.cos(now * 0.0017) * R * 0.35 + R * 0.25;
    pet.look.x = lerp(pet.look.x, tx, 0.05);
    pet.look.y = lerp(pet.look.y, ty, 0.05);
    return;
  }
  // 神经质扫视：眼睛高频快速左右扫
  if (pet.behavior === '神经质扫视' && now < pet.behaviorUntil){
    tx = Math.sin(now * 0.045) * R * 0.5;
    ty = Math.cos(now * 0.032) * R * 0.15;
    pet.look.x = lerp(pet.look.x, tx, 0.35);
    pet.look.y = lerp(pet.look.y, ty, 0.35);
    return;
  }
  // 偷看你：偷偷瞄一眼，幅度小
  if (pet.behavior === '偷看你' && now < pet.behaviorUntil){
    const dx = mouse.x - pet.x, dy = mouse.y - pet.y;
    const d = Math.hypot(dx, dy) || 1;
    tx = (dx / d) * R * 0.12 + Math.sin(now * 0.02) * R * 0.05;
    ty = (dy / d) * R * 0.10;
    pet.look.x = lerp(pet.look.x, tx, 0.06);
    pet.look.y = lerp(pet.look.y, ty, 0.06);
    return;
  }
  // 斜眼挑衅：眼睛一起斜向一侧
  if (pet.behavior === '斜眼挑衅' && now < pet.behaviorUntil){
    tx = R * 0.22; ty = R * 0.16;
    pet.look.x = lerp(pet.look.x, tx, 0.1);
    pet.look.y = lerp(pet.look.y, ty, 0.1);
    return;
  }
  // 望天发呆：眼睛朝上放空
  if (pet.behavior === '望天发呆' && now < pet.behaviorUntil){
    tx = Math.sin(now * 0.0015) * R * 0.08;
    ty = -R * 0.5;
    pet.look.x = lerp(pet.look.x, tx, 0.05);
    pet.look.y = lerp(pet.look.y, ty, 0.05);
    return;
  }
  // 思考：眼睛斜向上左右游移
  if (pet.behavior === '思考' && now < pet.behaviorUntil){
    tx = Math.sin(now * 0.0012) * R * 0.4;
    ty = -R * 0.42;
    pet.look.x = lerp(pet.look.x, tx, 0.06);
    pet.look.y = lerp(pet.look.y, ty, 0.06);
    return;
  }
  // 追尾巴：眼睛跟着身体绕圈
  if (pet.behavior === '追尾巴' && now < pet.behaviorUntil){
    const a = now * 0.006;
    tx = Math.cos(a) * R * 0.4;
    ty = Math.sin(a) * R * 0.3 + R * 0.1;
    pet.look.x = lerp(pet.look.x, tx, 0.3);
    pet.look.y = lerp(pet.look.y, ty, 0.3);
    return;
  }
  if (mouse.active){
    const dx = mouse.x - pet.x, dy = mouse.y - pet.y;
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(d, R * 1.4);
    tx = (dx / d) * m * 0.24;
    ty = (dy / d) * m * 0.24;
  } else {
    tx = Math.sin(now * 0.0011) * R * 0.18 + pet.saccade.x;
    ty = Math.cos(now * 0.0009) * R * 0.14 + pet.saccade.y;
  }
  pet.look.x = lerp(pet.look.x, tx, 0.1);
  pet.look.y = lerp(pet.look.y, ty, 0.1);
}

function updateOpen(){
  let baseL = 1, baseR = 1;
  if (pet.mood === 'sleep'){ baseL = 0; baseR = 0; }
  else if (pet.mood === 'sleepy'){ baseL = 0.35; baseR = 0.35; }
  else if (pet.mood === 'dizzy'){ baseL = 0.3; baseR = 0.3; }

  const blinking = now < pet.blinkStart + pet.blinkDur;
  const canBlink = pet.mood !== 'sleep' && pet.mood !== 'sleepy';
  if (blinking && canBlink){
    const p = clamp((now - pet.blinkStart) / pet.blinkDur, 0, 1);
    const b = 1 - Math.sin(Math.PI * p);
    pet.openL = baseL * b; pet.openR = baseR * b;
  } else {
    pet.openL = lerp(pet.openL, baseL, 0.18);
    pet.openR = lerp(pet.openR, baseR, 0.18);
  }
}

// 特殊创意行为的物理（满屏疯跑/爬到上面/咬鼠标/穿屏瞬移）
// 返回 true 表示本帧由该行为接管（跳过正常重力/碰撞/回家逻辑）
function specialPhysics(dt){
  const b = pet.behavior;
  if (now >= pet.behaviorUntil) return false;
  const p = clamp((now - pet.behaviorStart) / pet.behaviorDur, 0, 1);
  const k = dt / 16.7;

  if (b === '满屏疯跑'){
    // 每隔一段随机转向冲刺
    if (now >= pet.turnAt){
      pet.turnAt = now + RAND(800, 1800);
      pet.vx = (Math.random() < 0.5 ? -1 : 1) * RAND(5, 9);
      pet.vy = -RAND(2, 7);
    }
    pet.vy += 0.5 * k;
    pet.x += pet.vx * k;
    pet.y += pet.vy * k;
    pet.vx *= 0.985;
    if (pet.y >= floorY){ pet.y = floorY; pet.vy = -Math.abs(pet.vy) * 0.85; }
    if (pet.x < R){ pet.x = R; pet.vx = Math.abs(pet.vx); }
    if (pet.x > W - R){ pet.x = W - R; pet.vx = -Math.abs(pet.vx); }
    return true;
  }

  if (b === '爬到上面'){
    if (p < 0.22){ // 一跃而起
      pet.vy += 0.4 * k;
      pet.y += pet.vy * k;
      pet.x += pet.vx * k;
      if (p > 0.1 && pet.vy > -9) pet.vy = -9;
    } else if (p < 0.6){ // 贴到屏幕顶部，左右爬
      pet.y = lerp(pet.y, R * 0.9, 0.25);
      pet.vy = 0;
      pet.vx = Math.sin(now * 0.006) * 1.2;
      pet.x += pet.vx * k;
      pet.x = clamp(pet.x, R, W - R);
    } else { // 松开落回地面
      pet.vy += 0.5 * k;
      pet.y += pet.vy * k;
      pet.x += pet.vx * 0.2 * k;
      if (pet.y >= floorY){ pet.y = floorY; pet.vy = 0; pet.vx = 0; }
    }
    return true;
  }

  if (b === '咬鼠标'){
    const dx = mouse.x - pet.x, dy = mouse.y - pet.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > R * 0.9){
      // 冲向光标
      pet.vx += (dx / d) * 1.3;
      pet.vy += (dy / d) * 1.1;
    } else {
      // 到达，原地"啃"（快速上下小跳）
      pet.vx *= 0.5;
      pet.vy = (Math.floor(now / 140) % 2 === 0) ? -4 : 1;
    }
    pet.vx = clamp(pet.vx, -9, 9);
    pet.vy = clamp(pet.vy, -9, 9);
    pet.x += pet.vx * k;
    pet.y += pet.vy * k;
    pet.vx *= 0.94; pet.vy *= 0.94;
    if (pet.y >= floorY){ pet.y = floorY; if (pet.vy > 0) pet.vy = 0; }
    return true;
  }

  if (b === '穿屏瞬移'){
    if (p < 0.28){ // 从底部滑出（消失）
      pet.vy = 4;
      pet.x += pet.vx * k;
      pet.y += pet.vy * k;
    } else if (p < 0.72){ // 屏幕外藏起来
      pet.y = H + R * 3;
      pet.vy = 0;
    } else { // 从顶部边缘冒出来，落回地面
      if (pet.y > -R * 2){ pet.y = -R * 2; pet.vy = 1; pet.x = RAND(R, W - R); }
      pet.vy += 0.5 * k;
      pet.y += pet.vy * k;
      if (pet.y >= floorY){ pet.y = floorY; pet.vy = 0; }
    }
    return true;
  }

  return false;
}

function updatePhysics(dt){
  excite = clamp(excite - dt * 0.0006, 0, 1); // 兴奋缓慢回落
  pet.shake *= 0.88; // 抖动始终衰减（菜单打开时也不冻结）
  if (dragging || menuOpen) return;

  if (specialPhysics(dt)) return; // 特殊行为接管

  pet.vy += 0.5 * (dt / 16.7);
  pet.x += pet.vx * (dt / 16.7);
  pet.y += pet.vy * (dt / 16.7);
  pet.vx *= 0.92; pet.vy *= 0.98;

  if (pet.y >= floorY){
    pet.y = floorY;
    if (Math.abs(pet.vy) > 2) pet.vy *= -0.35; else pet.vy = 0;
  }
  if (pet.x < R){ pet.x = R; pet.vx = Math.abs(pet.vx) * 0.7; }
  if (pet.x > W - R){ pet.x = W - R; pet.vx = -Math.abs(pet.vx) * 0.7; }

  // 追逐鼠标
  if (pet.chasing && now < pet.chaseUntil){
    const dx = mouse.x - pet.x;
    if (Math.abs(dx) > R * 0.8){
      pet.vx += (dx > 0 ? 1 : -1) * 0.8;
    } else {
      pet.vx = 0;
    }
    if (Math.abs(dx) <= R * 0.8 && pet.vy === 0){
      pet.chasing = false;
      pet.mood = 'happy'; pet.moodUntil = performance.now() + 900;
      setBehavior('追上你啦');
      pet.vy = -5;
    }
  }
  if (pet.chasing && now >= pet.chaseUntil){ pet.chasing = false; }

  if (pet.goingHome){
    const d = pet.homeX - pet.x;
    if (Math.abs(d) > 3){
      pet.walkDir = d > 0 ? 1 : -1;
      pet.vx += pet.walkDir * 0.6;
    } else {
      pet.vx = 0; pet.x = pet.homeX;
      pet.goingHome = false;
      setBehavior('到家啦', 900);
      pet.mood = 'happy'; pet.moodUntil = performance.now() + 900;
      pet.vy = -4;
    }
  }

  // 自动回家：离开家后静置一段时间，自己慢慢走回去
  if (!pet.goingHome && pet.homeSet && !dragging && !pet.chasing && !menuOpen){
    if (Math.abs(pet.x - pet.homeX) > R * 1.2 &&
        performance.now() - lastInteract > 6000 &&
        Math.abs(pet.vx) < 0.5 && pet.vy === 0){
      pet.goingHome = true;
      pet.mood = 'neutral'; pet.moodUntil = 0;
      setBehavior('想起家了', 1500);
    }
  }

  if (pet.behavior === '打了个喷嚏' && now < pet.behaviorUntil){
    const p = (now - pet.behaviorStart) / pet.behaviorDur;
    if (p >= 0.6 && p < 0.62){ pet.vy = -7; }
  }

  // 突然抽风：连续快速不规则蹦跳
  if (pet.behavior === '突然抽风' && now < pet.behaviorUntil){
    const p = (now - pet.behaviorStart) / pet.behaviorDur;
    const hop = Math.floor(p * 3);
    if (hop !== pet.hopIdx && hop > 0){
      pet.hopIdx = hop;
      pet.vy = -9;
      pet.vx = (Math.random() < 0.5 ? -1 : 1) * RAND(2, 4);
    }
  }
}

function updatePetting(dt){
  if (mouse.active && !dragging && !menuOpen){
    const d = Math.hypot(mouse.x - pet.x, mouse.y - pet.y);
    if (d < R * 1.2 && Math.hypot(mouse.vx, mouse.vy) > 1 && Math.hypot(mouse.vx, mouse.vy) < 20){
      lastPetted += dt;
      if (lastPetted > 900){
        lastPetted = 0;
        pet.mood = 'happy'; pet.moodUntil = performance.now() + 900;
        setBehavior('被摸得好舒服');
      }
    } else {
      lastPetted = 0;
    }
  }
}

// ---------- 绘制 ----------
function drawBubbles(count, color){
  // 在身体上方飘出一串小圆泡（Zzz / 泡泡），随时间上浮淡出
  const p0 = now - pet.behaviorStart;
  for (let i = 0; i < count; i++){
    const ph = ((p0 / 1500) + i / count) % 1;
    const bx = (i - (count - 1) / 2) * R * 0.42 + Math.sin(ph * Math.PI * 2 + i * 1.7) * R * 0.14;
    const by = -R * 0.4 - ph * R * 1.3;
    ctx.globalAlpha = Math.max(0, 0.55 * (1 - ph));
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(bx, by, R * (0.07 + 0.05 * i), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawNotes(count){
  // 随音乐舞动时，头顶飘出 ♪ ♫ 音符，随节拍上浮淡出
  for (let i = 0; i < count; i++){
    const ph = ((now / 2200) + i / count) % 1;
    const nx = (i - (count - 1) / 2) * R * 0.5 + Math.sin(ph * Math.PI * 2 + i * 2.1) * R * 0.16;
    const ny = -R * 0.5 - ph * R * 1.5;
    ctx.globalAlpha = Math.max(0, 0.75 * (1 - ph));
    ctx.fillStyle = shade(bodyColor, 0.22);
    ctx.font = Math.round(R * 0.42) + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(i % 2 ? '♫' : '♪', nx, ny); // ♫ ♪
  }
  ctx.globalAlpha = 1;
}

function drawBeatRings(){
  // 随节拍从身体向外扩散的律动圆环（身体本身不变形，只是周围加光晕）
  const beat = (now % 900) / 900; // 约 900ms 一拍
  for (let i = 0; i < 2; i++){
    const ph = (beat + i / 2) % 1;
    const rr = R * (1 + ph * 1.1);
    ctx.globalAlpha = Math.max(0, 0.35 * (1 - ph));
    ctx.strokeStyle = shade(bodyColor, 0.15);
    ctx.lineWidth = Math.max(1.5, R * 0.05 * (1 - ph));
    ctx.beginPath();
    ctx.arc(0, 0, rr, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function capsule(cx, cy, len, thick, rot){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  const r = thick / 2;
  const hw = Math.max(0, (len - thick) / 2);
  if (hw < 0.5){
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore(); return;
  }
  ctx.beginPath();
  ctx.moveTo(-hw, -r);
  ctx.lineTo( hw, -r);
  ctx.arc( hw, 0, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(-hw,  r);
  ctx.arc(-hw, 0, r,  Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawEye(x, y, r, open, mood, side){
  ctx.fillStyle = eyeColor;
  ctx.strokeStyle = shade(eyeColor, -0.3);
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.lineCap = 'round';

  const dot = (cx, cy, rr) => {
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  };

  switch (mood){
    case 'happy':     capsule(x, y, r * 2.2, r * 0.42, -side * 0.30); return;
    case 'sad':       capsule(x, y, r * 2.2, r * 0.42,  side * 0.30); return;
    case 'surprised': dot(x, y, r * 1.35); return;
    case 'dizzy':     capsule(x, y, r * 2.0, r * 0.30, 0); return;
    case 'sleepy':    capsule(x, y, r * 2.0, r * 0.5, 0); return;
    case 'sleep':     capsule(x, y, r * 2.2, r * 0.2, 0); return;
    case 'sneer':     capsule(x, y, r * 1.8, r * 0.40, -0.55); return; // 斜眼：两只都往一边斜
    case 'wink':      return side < 0 ? capsule(x, y, r * 2.0, r * 0.35, 0) : dot(x, y, r); // 眨眼：一只眯一只圆
    case 'fierce':    capsule(x, y, r * 1.8, r * 0.35, -0.5); return; // 凶狠：细斜眼盯着猎物
    case 'angry':     capsule(x, y, r * 1.9, r * 0.5, side * 0.55); return; // 生气：斜眼成怒眉
    case 'dazed':     dot(x, y, r * 0.4); return; // 呆滞豆豆眼
    case 'pleading':  capsule(x, y, r * 2.3, r * 0.42, side * 0.45); return; // 委屈：向下弯的大眼
    default:
      const thick = Math.max(2 * r * open, r * 0.2);
      const len = 2 * r * (1 + (1 - open) * 0.3);
      capsule(x, y, len, thick, 0);
      return;
  }
}

function draw(){
  ctx.clearRect(0, 0, W, H);

  // 家的标记
  if (pet.homeSet){
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.arc(pet.homeX, floorY + R * 0.7, R * 0.25, 0, Math.PI * 2); ctx.fill();
  }

  // 地面阴影（穿屏瞬移"消失"阶段不画阴影，避免露馅）
  const b0 = pet.behavior;
  const hidden = b0 === '穿屏瞬移' && now < pet.behaviorUntil &&
    (now - pet.behaviorStart) / pet.behaviorDur >= 0.28 &&
    (now - pet.behaviorStart) / pet.behaviorDur < 0.72;
  if (!hidden){
    const shadowScale = 1 - clamp((floorY - pet.y) / 300, 0, 1) * 0.5;
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.beginPath();
    ctx.ellipse(pet.x, floorY + R * 0.85, R * 0.8 * shadowScale, R * 0.16 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const shakeX = pet.shake > 0.01 ? (Math.random() - 0.5) * pet.shake * 6 : 0;

  // 各行为的身体位移（身体仍是正圆，只是整体平移，不变形）
  const b = pet.behavior;
  const active = now < pet.behaviorUntil;
  let moffX = 0, moffY = 0;
  if (active){
    const p = clamp((now - pet.behaviorStart) / pet.behaviorDur, 0, 1);
    if (b === '哼歌摇摆'){
      moffX = Math.sin(now * 0.012) * R * 0.07;
      moffY = Math.sin(now * 0.024) * R * 0.02;
    } else if (b === '打瞌睡'){
      moffY = Math.sin(clamp(p * 1.4, 0, 1) * Math.PI) * R * 0.13; // 点头下沉再抬头
    } else if (b === '卖萌'){
      moffY = -Math.sin(p * Math.PI) * R * 0.07; // 小跳
    } else if (b === '被吓一跳'){
      moffY = -Math.sin(p * Math.PI) * R * 0.05;
    } else if (b === '睡死打呼噜'){
      moffY = Math.sin(now * 0.004) * R * 0.035; // 呼吸起伏
    } else if (b === '斜眼挑衅'){
      moffX = Math.sin(now * 0.02) * R * 0.06; // 贱兮兮地晃
    } else if (b === '被拍头'){
      moffY = Math.sin(p * Math.PI) * R * 0.06; // 头被拍得往下一点
    } else if (b === '被弹脑门'){
      moffX = Math.sin(p * Math.PI) * R * 0.08; // 弹得后仰
    } else if (b === '打嗝'){
      const tick = (now % 800) / 800;
      moffY = tick < 0.15 ? Math.sin(tick / 0.15 * Math.PI) * R * 0.06 : 0; // 一抽一抽
    } else if (b === '望天发呆'){
      moffY = -R * 0.03;
      moffX = Math.sin(now * 0.002) * R * 0.02;
    } else if (b === '思考'){
      moffX = Math.sin(now * 0.003) * R * 0.03; // 微微前后晃
    } else if (b === '抖腿'){
      moffX = Math.sin(now * 0.05) * R * 0.03; // 高频小抖
    } else if (b === '抓痒'){
      moffX = Math.sin(now * 0.03) * R * 0.08; // 左右蹭地
    } else if (b === '连环喷嚏'){
      const sp = (now % 700) / 700;
      moffY = sp < 0.12 ? -Math.sin(sp / 0.12 * Math.PI) * R * 0.1 : 0; // 连续打喷嚏
    } else if (b === '追尾巴'){
      moffX = Math.cos(now * 0.006) * R * 0.12; // 原地绕圈
      moffY = Math.sin(now * 0.006) * R * 0.06;
    }
  }
  // 随音乐舞动：音乐播放且没有互动动作时，用当前舞步平移（仍只是整体平移，不变形）
  if (music.playing && !active){
    const d = danceOffset();
    moffX = d.x;
    moffY = d.y;
  }

  ctx.save();
  ctx.translate(pet.x + shakeX + moffX, pet.y + moffY);

  // 身体：恒定正圆，永不形变
  ctx.fillStyle = bodyColor;
  ctx.strokeStyle = shade(bodyColor, -0.25);
  ctx.lineWidth = Math.max(2, R * 0.03);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 眼睛
  const sx = R * 0.34, eyeY = -R * 0.05, eyeR = R * 0.22;

  if (active && b === '打滚'){
    const p = clamp((now - pet.behaviorStart) / pet.behaviorDur, 0, 1);
    const roll = p * Math.PI * 2;
    const c = Math.cos(roll), s = Math.sin(roll);
    drawEye(-sx * c - eyeY * s, -sx * s + eyeY * c, eyeR, 1, 'neutral', -1);
    drawEye( sx * c - eyeY * s,  sx * s + eyeY * c, eyeR, 1, 'neutral',  1);
  } else if (active && b === '躲猫猫'){
    drawEye(-sx + pet.look.x, eyeY + pet.look.y, eyeR * 0.45, 1, 'neutral', -1);
    drawEye( sx + pet.look.x, eyeY + pet.look.y, eyeR * 0.45, 1, 'neutral',  1);
  } else {
    drawEye(-sx + pet.look.x, eyeY + pet.look.y, eyeR, pet.openL, pet.mood, -1);
    drawEye( sx + pet.look.x, eyeY + pet.look.y, eyeR, pet.openR, pet.mood,  1);
  }

  // 睡死打呼噜 → Zzz；冒泡泡 → 圆泡泡
  if (active && b === '睡死打呼噜'){
    drawBubbles(3, 'rgba(255,255,255,0.65)');
  } else if (active && b === '冒泡泡'){
    drawBubbles(4, shade(bodyColor, 0.42));
  }

  // 思考 → 头顶飘省略号；打坐冥想 → 头顶飘圈
  if (active && b === '思考'){
    ctx.fillStyle = shade(bodyColor, 0.25);
    ctx.font = Math.round(R * 0.4) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const dph = ((now - pet.behaviorStart) / 1200) % 1;
    for (let i = 0; i < 3; i++){
      const oy = -R * 0.55 - ((dph + i * 0.25) % 1) * R * 0.5;
      ctx.globalAlpha = Math.max(0, 0.7 * (1 - dph));
      ctx.fillText('·', (i - 1) * R * 0.18, oy);
    }
    ctx.globalAlpha = 1;
  } else if (active && b === '打坐冥想'){
    const mph = ((now - pet.behaviorStart) / 2200) % 1;
    for (let i = 0; i < 3; i++){
      const oy = -R * 0.5 - ((mph + i * 0.33) % 1) * R * 1.0;
      ctx.globalAlpha = Math.max(0, 0.5 * (1 - ((mph + i * 0.33) % 1)));
      ctx.strokeStyle = shade(bodyColor, 0.2);
      ctx.lineWidth = Math.max(1, R * 0.04);
      ctx.beginPath();
      ctx.arc(Math.sin(i * 2) * R * 0.12, oy, R * 0.08, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // 被戳晕 / 被转晕 → 头顶绕圈的小圆点（晕乎乎）；只有这两个明确的"晕"行为才显示
  if (active && (b === '被戳晕了' || b === '被转晕')){
    for (let i = 0; i < 3; i++){
      const a = now * 0.01 + i * Math.PI * 2 / 3;
      const oxx = Math.cos(a) * R * 0.55;
      const oyy = Math.sin(a) * R * 0.32 - R * 0.7;
      ctx.fillStyle = shade(bodyColor, 0.30);
      ctx.beginPath();
      ctx.arc(oxx, oyy, R * 0.055, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 随音乐舞动 → 律动圆环 + 头顶飘音符
  if (music.playing){
    drawBeatRings();
    drawNotes(5);
  }

  ctx.restore();
}

function loop(t){
  now = t;
  const dt = lastNow ? Math.min(t - lastNow, 50) : 16.7;
  lastNow = t;

  updateBehavior();
  updateMood();
  updateDance();
  if (now >= pet.nextBlink && pet.mood !== 'sleep' && pet.mood !== 'sleepy'){
    startBlink(now);
  }
  updateLook();
  updateOpen();
  updatePhysics(dt);
  updatePetting(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
