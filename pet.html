<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌面宠物 · 团团</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#171a21; }
  body{ font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  canvas{ display:block; cursor:grab; }
  .hint{ position:fixed; left:16px; top:12px; color:#8fa3b8; font-size:12px; line-height:1.8;
         user-select:none; pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.5); white-space:pre-line; }
  .hud{ position:fixed; right:16px; top:12px; text-align:right; color:#dbe7f2; font-size:13px;
        user-select:none; pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.5); line-height:1.6; }
  .hud .bar{ width:130px; height:10px; border-radius:5px; background:#2a3948; margin-left:auto;
             overflow:hidden; border:1px solid #3a4a5c; }
  .hud .bar i{ display:block; height:100%; background:#7fd0a5; width:0%; transition:width .2s; }
  .panel{ position:fixed; left:16px; bottom:16px; display:flex; flex-wrap:wrap; gap:8px; max-width:560px; }
  .panel button{
    appearance:none; border:1px solid #3a4a5c; background:#1f2a36; color:#dbe7f2;
    padding:6px 12px; border-radius:9px; font-size:13px; cursor:pointer; transition:.15s;
  }
  .panel button:hover{ background:#2a3948; }
  .panel button.active{ background:#3d5a75; border-color:#6f93b5; }
  .sep{ width:100%; height:4px; }
  label{ color:#8fa3b8; font-size:12px; display:flex; align-items:center; gap:6px; }
  input[type=color]{ width:34px; height:26px; border:none; background:none; cursor:pointer; padding:0; }
  .swatch{ width:28px; height:28px; border-radius:50%; border:2px solid #3a4a5c; cursor:pointer; padding:0;
           transition:.15s; }
  .swatch:hover{ border-color:#7fd0a5; }
  .swatch.active{ border-color:#fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint"></div>
<div class="hud">
  <div id="moodText">心情：平静</div>
  <div id="behavText" style="font-size:12px;color:#8fa3b8;">正在发呆</div>
</div>
<div class="panel">
  <button data-mood="neutral">正常</button>
  <button data-mood="happy">开心</button>
  <button data-mood="sad">难过</button>
  <button data-mood="surprised">惊讶</button>
  <button data-mood="sleepy">犯困</button>
  <button data-mood="sleep">睡觉</button>
  <button data-mood="dizzy">晕眩</button>
  <button id="setHomeBtn">定家</button>
  <button id="goHomeBtn">回家</button>
  <div class="sep"></div>
  <label>配色</label>
  <button class="swatch active" data-body="#F6E7C6" data-eye="#4A4038" style="background:#F6E7C6" title="奶油"></button>
  <button class="swatch" data-body="#F4EFE6" data-eye="#3F3A36" style="background:#F4EFE6" title="奶白"></button>
  <button class="swatch" data-body="#F2D8D5" data-eye="#55403E" style="background:#F2D8D5" title="豆沙粉"></button>
  <button class="swatch" data-body="#D9E8DC" data-eye="#3E4A43" style="background:#D9E8DC" title="薄荷"></button>
  <button class="swatch" data-body="#DCE4EC" data-eye="#3A4654" style="background:#DCE4EC" title="雾蓝"></button>
  <label>身体 <input type="color" id="bodyColor" value="#F6E7C6"></label>
  <label>眼睛 <input type="color" id="eyeColor" value="#4A4038"></label>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
const moodText = document.getElementById('moodText');
const behavText = document.getElementById('behavText');

let W = 0, H = 0, DPR = 1, R = 0, floorY = 0;

function resize(){
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  R = Math.min(W, H) * 0.13;
  floorY = H - R - 24;
  if (!pet.x && !pet.y){ pet.x = W / 2; pet.y = floorY; }
  if (!pet.homeSet){ pet.homeX = W / 2; pet.homeSet = true; }
}
window.addEventListener('resize', resize);

// ---------- 配色 ----------
let bodyColor = '#F6E7C6';
let eyeColor  = '#4A4038';

// 颜色加深/提亮：amt<0 变暗，amt>0 变亮（用于自动生成描边色）
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0){ const k = 1 + amt; r *= k; g *= k; b *= k; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  const h = x => Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0');
  return '#' + h(r) + h(g) + h(b);
}

document.getElementById('bodyColor').addEventListener('input', e => bodyColor = e.target.value);
document.getElementById('eyeColor').addEventListener('input',  e => eyeColor  = e.target.value);

// 配色预设
document.querySelectorAll('.swatch').forEach(b => {
  b.addEventListener('click', () => {
    bodyColor = b.dataset.body;
    eyeColor = b.dataset.eye;
    document.getElementById('bodyColor').value = bodyColor;
    document.getElementById('eyeColor').value = eyeColor;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
});

// ---------- 宠物状态 ----------
const pet = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  walkT: 0, walkDir: 1,
  mood: 'neutral',
  moodUntil: 0,
  nextAutoMood: 0,
  nextBehavior: 3000,
  behavior: '', behaviorUntil: 0, behaviorStart: 0, behaviorDur: 1200,
  lastPetted: 0,
  homeX: 0, homeSet: false, goingHome: false,
  look: { x: 0, y: 0 },
  openL: 1, openR: 1,
  blinkStart: 0, blinkDur: 0, nextBlink: 0,
  squish: 0,
  breathPhase: 0,
  saccadeUntil: 0, saccade: { x: 0, y: 0 },
};
resize(); // 初始化画布/尺寸/位置（须在 pet 定义之后）

const RAND = (a,b) => a + Math.random() * (b - a);
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp = (a,b,t) => a + (b - a) * t;

// 心情文字
const MOOD_NAME = {
  neutral:'平静', happy:'开心', sad:'难过', surprised:'惊讶',
  sleepy:'犯困', sleep:'睡觉', dizzy:'晕眩',
};

// ---------- 鼠标 ----------
const mouse = { x: 0, y: 0, active: false, px: 0, py: 0, vx: 0, vy: 0 };
let dragging = false, dragDX = 0, dragDY = 0, dragMoved = false;
let downTime = 0, downX = 0, downY = 0;
let petStreak = 0, petStreakT = 0;
let hoverT = 0;

window.addEventListener('mousemove', e => {
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.vx = (mouse.x - mouse.px); mouse.vy = (mouse.y - mouse.py);
  mouse.active = true;
  if (dragging){
    const nx = e.clientX - dragDX, ny = e.clientY - dragDY;
    if (Math.hypot(nx - pet.x, ny - pet.y) > 3) dragMoved = true;
    pet.x = nx; pet.y = ny;
    pet.vx = mouse.vx; pet.vy = mouse.vy;
  }
});
window.addEventListener('mouseleave', () => { mouse.active = false; });

cv.addEventListener('mousedown', e => {
  const dx = e.clientX - pet.x, dy = e.clientY - pet.y;
  downTime = performance.now(); downX = e.clientX; downY = e.clientY;
  if (dx*dx + dy*dy <= R * R * 1.2){
    dragging = true; dragDX = dx; dragDY = dy; dragMoved = false;
    cv.style.cursor = 'grabbing';
  }
});
window.addEventListener('mouseup', e => {
  if (dragging){
    dragging = false; cv.style.cursor = 'grab';
    // 甩飞：松手时赋予速度
    if (Math.hypot(mouse.vx, mouse.vy) > 12){
      pet.vx = mouse.vx * 1.1; pet.vy = mouse.vy * 1.1 - 3;
      pet.mood = 'surprised'; pet.moodUntil = performance.now() + 700;
      setBehavior('甩飞');
    }
    return;
  }
  // 轻点（非拖动）
  if (performance.now() - downTime < 220){
    const dx = e.clientX - pet.x, dy = e.clientY - pet.y;
    if (dx*dx + dy*dy <= R * R * 1.2){
      clickPet();
    }
  }
});

cv.addEventListener('click', e => {
  if (dragMoved) return;
  // 点击已由 mouseup 处理（避免双击计数）
});

function clickPet(){
  pet.squish = Math.max(pet.squish, 1);
  pet.vy = -6;
  pet.mood = 'surprised'; pet.moodUntil = performance.now() + 600;
  setBehavior('被点了一下');
  // 连续戳
  const now = performance.now();
  if (now - petStreakT < 800) petStreak++; else petStreak = 1;
  petStreakT = now;
  if (petStreak >= 3){
    pet.mood = 'dizzy'; pet.moodUntil = now + 1500;
    setBehavior('被戳晕了');
    petStreak = 0;
  }
}

document.getElementById('setHomeBtn').addEventListener('click', () => {
  pet.homeX = pet.x; pet.homeSet = true;
  pet.mood = 'happy'; pet.moodUntil = performance.now() + 900;
  pet.vy = -4;
  setBehavior('记下家了');
});

document.getElementById('goHomeBtn').addEventListener('click', () => {
  if (!pet.homeSet) return;
  pet.goingHome = true;
  pet.mood = 'neutral'; pet.moodUntil = 0;
});

document.querySelectorAll('[data-mood]').forEach(btn => {
  btn.addEventListener('click', () => {
    const m = btn.dataset.mood;
    if (m === 'neutral'){ pet.mood = 'neutral'; pet.moodUntil = 0; }
    else { pet.mood = m; pet.moodUntil = performance.now() + 4000; }
    if (m !== 'sleep') pet.squish = Math.max(pet.squish, 1);
  });
});

function setBehavior(t, dur = 1200){
  pet.behavior = t;
  pet.behaviorStart = performance.now();
  pet.behaviorDur = dur;
  pet.behaviorUntil = pet.behaviorStart + dur;
}

// ---------- 眨眼 ----------
function startBlink(now){
  pet.blinkStart = now;
  pet.blinkDur = 160;
  pet.nextBlink = now + pet.blinkDur + RAND(2000, 4500);
}

// ---------- 好感度影响心情 ----------
const AUTO_MOODS = ['neutral','happy','sad','surprised','sleepy','dizzy'];
function randomMood(){
  return AUTO_MOODS[(Math.random()*AUTO_MOODS.length)|0];
}

// ---------- 更新 ----------
function updateBehavior(now){
  // 到点触发一个自发小动作
  if (now < pet.nextBehavior) return;
  pet.nextBehavior = now + RAND(5000, 11000);

  const roll = Math.random();
  if (roll < 0.24) setBehavior('扫视四周', 800);
  else if (roll < 0.36) setBehavior('打了个哈欠', 1400);
  else if (roll < 0.48) setBehavior('伸了个懒腰', 1200);
  else if (roll < 0.60) setBehavior('叹了口气', 1200);
  else if (roll < 0.68) setBehavior('蹦了一下', 700);
  else if (roll < 0.76) setBehavior('走两步', 1500);
  else if (roll < 0.86) setBehavior('打了个喷嚏', 1400);
  else if (roll < 0.94) setBehavior('打滚', 1600);
  else setBehavior('躲猫猫', 1800);

  if (pet.behavior === '蹦了一下'){ pet.vy = -6; }
  if (pet.behavior === '走两步'){ pet.walkDir = Math.random() < 0.5 ? 1 : -1; }
}

function updateMood(now){
  // 自动心情（好感度驱动）＋ 随机表情
  if (now >= pet.moodUntil){
    if (now >= pet.nextAutoMood){
      pet.nextAutoMood = now + RAND(6000, 12000);
      pet.mood = randomMood();
      pet.moodUntil = now + RAND(1500, 3000);
    }
  }
  // 行为覆盖表情
  if (now < pet.behaviorUntil){
    if (pet.behavior === '打了个哈欠') pet.mood = 'sleepy';
    else if (pet.behavior === '伸了个懒腰') pet.mood = 'happy';
    else if (pet.behavior === '叹了口气') pet.mood = 'sad';
    else if (pet.behavior === '打了个喷嚏') pet.mood = 'surprised';
    else if (pet.behavior === '打滚') pet.mood = 'neutral';
  }
}

function updateLook(now){
  // 扫视
  if (now >= pet.saccadeUntil){
    pet.saccadeUntil = now + RAND(2500, 5000);
    const a = RAND(0, Math.PI * 2);
    pet.saccade = { x: Math.cos(a) * R * 0.5, y: Math.sin(a) * R * 0.5 };
  }
  let tx, ty;
  if (mouse.active){
    const dx = mouse.x - pet.x, dy = mouse.y - pet.y;
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(d, R * 1.4);
    tx = (dx / d) * m * 0.24;
    ty = (dy / d) * m * 0.24;
  } else {
    tx = Math.sin(now * 0.0011) * R * 0.18 + pet.saccade.x;
    ty = Math.cos(now * 0.0009) * R * 0.14 + pet.saccade.y;
  }
  pet.look.x = lerp(pet.look.x, tx, 0.1);
  pet.look.y = lerp(pet.look.y, ty, 0.1);
}

function updateOpen(now){
  let baseL = 1, baseR = 1;
  if (pet.mood === 'sleep'){ baseL = 0; baseR = 0; }
  else if (pet.mood === 'sleepy'){ baseL = 0.35; baseR = 0.35; }
  else if (pet.mood === 'dizzy'){ baseL = 0.3; baseR = 0.3; }

  const blinking = now < pet.blinkStart + pet.blinkDur;
  const canBlink = pet.mood !== 'sleep' && pet.mood !== 'sleepy';
  if (blinking && canBlink){
    const p = clamp((now - pet.blinkStart) / pet.blinkDur, 0, 1);
    const b = 1 - Math.sin(Math.PI * p);
    pet.openL = baseL * b; pet.openR = baseR * b;
  } else {
    pet.openL = lerp(pet.openL, baseL, 0.18);
    pet.openR = lerp(pet.openR, baseR, 0.18);
  }
}

function updatePhysics(dt){
  // 重力
  pet.vy += 0.5 * (dt / 16.7);
  pet.x += pet.vx * (dt / 16.7);
  pet.y += pet.vy * (dt / 16.7);

  // 摩擦
  pet.vx *= 0.92; pet.vy *= 0.98;

  // 落地
  if (pet.y >= floorY){
    if (pet.vy > 3) pet.squish = Math.max(pet.squish, 1);
    pet.y = floorY;
    if (Math.abs(pet.vy) > 2) pet.vy *= -0.35; else pet.vy = 0;
  }
  // 左右墙反弹
  if (pet.x < R){ pet.x = R; pet.vx = Math.abs(pet.vx) * 0.7; }
  if (pet.x > W - R){ pet.x = W - R; pet.vx = -Math.abs(pet.vx) * 0.7; }

  // 行走
  if (pet.behavior === '走两步' && now < pet.behaviorUntil){
    pet.vx += pet.walkDir * 0.4;
  }

  // 回家：自己爬回固定位置
  if (pet.goingHome){
    const d = pet.homeX - pet.x;
    if (Math.abs(d) > 3){
      pet.walkDir = d > 0 ? 1 : -1;
      pet.vx += pet.walkDir * 0.6;
    } else {
      pet.vx = 0; pet.x = pet.homeX;
      pet.goingHome = false;
      setBehavior('到家啦', 900);
      pet.mood = 'happy'; pet.moodUntil = performance.now() + 900;
      pet.vy = -4;
    }
  }

  // 打喷嚏：积蓄后爆发跳起
  if (pet.behavior === '打了个喷嚏' && now < pet.behaviorUntil){
    const p = (now - pet.behaviorStart) / pet.behaviorDur;
    if (p >= 0.6 && p < 0.62){ pet.vy = -7; pet.squish = Math.max(pet.squish, 1); }
  }

  pet.squish *= 0.86;
  pet.breathPhase += 0.025;
}

// 抚摸检测：鼠标在宠物身上缓慢移动
function updatePetting(dt){
  if (mouse.active && !dragging){
    const d = Math.hypot(mouse.x - pet.x, mouse.y - pet.y);
    if (d < R * 1.3 && Math.hypot(mouse.vx, mouse.vy) > 1 && Math.hypot(mouse.vx, mouse.vy) < 20){
      pet.lastPetted += dt;
      if (pet.lastPetted > 900){
        pet.lastPetted = 0;
        pet.mood = 'happy'; pet.moodUntil = performance.now() + 900;
        setBehavior('被摸得好舒服');
        pet.squish = Math.max(pet.squish, 0.6);
      }
    } else {
      pet.lastPetted = 0;
    }
  }
}

// ---------- 绘制 ----------
// 跑道形胶囊
function capsule(cx, cy, len, thick, rot){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  const r = thick / 2;
  const hw = Math.max(0, (len - thick) / 2);
  if (hw < 0.5){
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore(); return;
  }
  ctx.beginPath();
  ctx.moveTo(-hw, -r);
  ctx.lineTo( hw, -r);
  ctx.arc( hw, 0, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(-hw,  r);
  ctx.arc(-hw, 0, r,  Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawEye(x, y, r, open, mood, side){
  ctx.fillStyle = eyeColor;
  ctx.strokeStyle = shade(eyeColor, -0.3);
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.lineCap = 'round';

  const dot = (cx, cy, rr) => {
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  };

  switch (mood){
    case 'happy':
      capsule(x, y, r * 2.2, r * 0.42, -side * 0.30);
      return;
    case 'sad':
      capsule(x, y, r * 2.2, r * 0.42,  side * 0.30);
      return;
    case 'surprised':
      dot(x, y, r * 1.35);
      return;
    case 'dizzy':
      capsule(x, y, r * 2.0, r * 0.30, 0);
      return;
    case 'sleepy':
      capsule(x, y, r * 2.0, r * 0.5, 0);
      return;
    case 'sleep':
      capsule(x, y, r * 2.2, r * 0.2, 0);
      return;
    default:
      const thick = Math.max(2 * r * open, r * 0.2);
      const len = 2 * r * (1 + (1 - open) * 0.3);
      capsule(x, y, len, thick, 0);
      return;
  }
}

function draw(now){
  ctx.clearRect(0, 0, W, H);

  // 家的标记（一个淡淡的圆环）
  if (pet.homeSet){
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    ctx.arc(pet.homeX, floorY + R * 0.7, R * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath();
    ctx.arc(pet.homeX, floorY + R * 0.7, R * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }

  // 地面阴影
  const shadowScale = 1 - clamp((floorY - pet.y) / 300, 0, 1) * 0.5;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(pet.x, floorY + R * 0.9, R * 0.8 * shadowScale, R * 0.16 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  const breath = 1 + 0.02 * Math.sin(pet.breathPhase);

  ctx.save();
  ctx.translate(pet.x, pet.y);

  // 身体（圆）：呼吸 + 落地挤压 + 各行为形变
  let sq = pet.squish * 0.06;
  let rx = R * breath * (1 + sq);
  let ry = R * breath * (1 - sq);
  let roll = 0;

  if (now < pet.behaviorUntil){
    const p = clamp((now - pet.behaviorStart) / pet.behaviorDur, 0, 1);
    if (pet.behavior === '伸了个懒腰'){ rx *= 1.12; ry *= 0.9; }
    else if (pet.behavior === '叹了口气'){
      const s = Math.sin(p * Math.PI); rx *= 1 + s * 0.05; ry *= 1 - s * 0.05;
    }
    else if (pet.behavior === '打了个喷嚏'){
      if (p < 0.6){ const q = p / 0.6; rx *= 1 - 0.1 * q; ry *= 1 + 0.1 * q; }
      else { const q = (p - 0.6) / 0.4; rx *= 1 - 0.15 * q; ry *= 1 + 0.2 * q; }
    }
    else if (pet.behavior === '躲猫猫'){
      if (p < 0.5){ const q = p / 0.5; rx *= 1 + 0.35 * q; ry *= 1 - 0.6 * q; }
      else { const q = (p - 0.5) / 0.5; rx *= 1.35 - 0.35 * q; ry *= 0.4 + 0.6 * q; }
    }
    else if (pet.behavior === '打滚'){
      roll = p * Math.PI * 2;
    }
  }

  ctx.fillStyle = bodyColor;
  ctx.strokeStyle = shade(bodyColor, -0.25);
  ctx.lineWidth = Math.max(2, R * 0.03);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 眼睛（打滚时绕身体中心旋转）
  const sx = R * 0.34, eyeY = -R * 0.05, eyeR = R * 0.22;
  let lx = -sx, ly = eyeY, rxx = sx, ryy = eyeY;
  if (roll){
    const c = Math.cos(roll), s = Math.sin(roll);
    lx = -sx * c - eyeY * s;  ly = -sx * s + eyeY * c;
    rxx =  sx * c - eyeY * s; ryy =  sx * s + eyeY * c;
    drawEye(lx, ly, eyeR, 1, 'neutral', -1);
    drawEye(rxx, ryy, eyeR, 1, 'neutral',  1);
  } else {
    drawEye(lx + pet.look.x, ly + pet.look.y, eyeR, pet.openL, pet.mood, -1);
    drawEye(rxx + pet.look.x, ryy + pet.look.y, eyeR, pet.openR, pet.mood,  1);
  }

  ctx.restore();
}

// ---------- HUD ----------
function updateHUD(){
  moodText.textContent = '心情：' + (MOOD_NAME[pet.mood] || '平静');
  if (pet.goingHome) behavText.textContent = '正在回家…';
  else behavText.textContent = now < pet.behaviorUntil ? pet.behavior : '正在发呆';
}

let lastNow = 0, now = 0;
function loop(t){
  now = t;
  const dt = lastNow ? Math.min(t - lastNow, 50) : 16.7;
  lastNow = t;

  updateBehavior(now);
  updateMood(now);
  if (now >= pet.nextBlink && pet.mood !== 'sleep' && pet.mood !== 'sleepy'){
    startBlink(now);
  }
  updateLook(now);
  updateOpen(now);
  updatePhysics(dt);
  updatePetting(dt);
  updateHUD();
  draw(now);
  requestAnimationFrame(loop);
}

hint.textContent =
  '● 点击 → 跳一下    连续戳3下 → 晕眩    按住拖动 → 甩飞\n' +
  '● 鼠标在它身上来回划 → 抚摸\n' +
  '● 拖动到喜欢的位置 → 点「定家」；点「回家」→ 它自己爬回去\n' +
  '● 它平时会自己：打哈欠 / 伸懒腰 / 打喷嚏 / 打滚 / 躲猫猫 / 走两步';
requestAnimationFrame(loop);
</script>
